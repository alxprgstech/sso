[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alxprgs-sso-backend"
version = "0.2.0"
description = "ALXPRGS SSO Authentication Server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ALXPRGS Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.3",
    "authlib>=1.3.2",
    "pyjwt[crypto]>=2.9.0",
    "webauthn>=2.5.0",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.17",
    "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.1",
    "mypy>=1.13.0",
    "types-requests>=2.32.0",
]

[project.scripts]
alx-admin = "app.cli.bootstrap_admin:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
