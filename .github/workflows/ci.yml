name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string

concurrency:
  group: ci-${{ inputs.target_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-cd-template:
    name: Verify Inactive CD Template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Check CD template is commented out and outside workflows
        run: |
          if [ -f ".github/workflows/cd.yml" ]; then
            echo "ERROR: Active CD workflow .github/workflows/cd.yml must NOT exist!"
            exit 1
          fi
          if [ ! -f "deploy/github-actions/cd.yml.example" ]; then
            echo "ERROR: deploy/github-actions/cd.yml.example not found!"
            exit 1
          fi
          # Проверяем, что каждая непустая строка начинается с '#'
          non_commented=$(grep -v '^#' deploy/github-actions/cd.yml.example | grep -v '^[[:space:]]*$' || true)
          if [ -n "$non_commented" ]; then
            echo "ERROR: deploy/github-actions/cd.yml.example contains uncommented lines:"
            echo "$non_commented"
            exit 1
          fi
          echo "CD template is properly commented and isolated."

  security-and-deps-scan:
    name: Security & Dependencies Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Security and Dependency Scanner
        run: python scripts/scan_secrets_and_deps.py

      - name: Audit pinned Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --strict -r requirements-lock.txt

      - name: Scan tracked source for secrets without printing values
        run: |
          python -m pip install detect-secrets==1.5.0
          python scripts/check_secret_scan.py --self-test

  version-consistency:
    name: Verify Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check version consistency
        run: python scripts/bump_version.py check

  backend-lint-and-test:
    name: Backend Tests & PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sso_user
          POSTGRES_PASSWORD: sso_test_password
          POSTGRES_DB: alxprgs_sso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sso_user -d alxprgs_sso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend and SDK dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation -e "./backend[dev]" -e "./packages/python-sdk"
          python -m pip check

      - name: Run Ruff Lint and Format check
        run: |
          ruff check backend/ tests/ packages/python-sdk/ scripts/ examples/
          ruff format --check backend/ tests/ packages/python-sdk/ scripts/ examples/

      - name: Run Mypy Typecheck
        run: |
          mypy --explicit-package-bases packages/python-sdk/alxprgs_sso backend/app --ignore-missing-imports

      - name: Run Database Migrations
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          SESSION_SECRET_KEY: "default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only"
        run: |
          cd backend && alembic upgrade head

      - name: Mark fresh dedicated CI database and check PostgreSQL client
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version
          psql --version
          python -m scripts.init_fresh_ci_test_marker

      - name: Run Backend Tests on PostgreSQL (Default-off profile)
        env:
          EMAIL_PROVIDER: "smtp"
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          SESSION_SECRET_KEY: "default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only"
          FEATURE_TOTP_ENABLED: "false"
          FEATURE_PASSKEY_ENABLED: "false"
          FEATURE_RECOVERY_CODES_ENABLED: "false"
          FEATURE_EMAIL_VERIFICATION_ENABLED: "false"
          REQUIRE_VERIFIED_EMAIL: "false"
          TOTP_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
          JWT_PRIVATE_KEY_PEM: ""
        run: |
          pytest -v tests/

      - name: Run MFA & Feature Flags Tests (Enabled profile)
        env:
          EMAIL_PROVIDER: "smtp"
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          SESSION_SECRET_KEY: "default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only"
          FEATURE_TOTP_ENABLED: "true"
          FEATURE_PASSKEY_ENABLED: "true"
          FEATURE_RECOVERY_CODES_ENABLED: "true"
          FEATURE_EMAIL_VERIFICATION_ENABLED: "true"
          REQUIRE_VERIFIED_EMAIL: "true"
          TOTP_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
        run: |
          pytest -v tests/test_mfa_features.py tests/integration/test_email_verification_pg.py tests/integration/test_passkey_pg.py tests/integration/test_distributed_rate_limiting_pg.py

  sdk-build-and-test:
    name: SDK Package Build & Clean Install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build SDK Wheel and Sdist
        run: |
          python -m pip install -r requirements-lock.txt
          python -m build --no-isolation packages/python-sdk --outdir dist/sdk

      - name: Test clean installation in isolated venv
        run: |
          python -m venv test_env
          ./test_env/bin/pip install -r requirements-lock.txt
          ./test_env/bin/pip install --no-deps dist/sdk/*.whl
          ./test_env/bin/pip check
          ./test_env/bin/pytest packages/python-sdk/tests/test_sdk_isolated.py tests/test_python_sdk.py -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Typecheck, Unit Tests and Build
        working-directory: frontend
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run typecheck:tests
          npm test
          npm run test:components
          npm run build

  playwright-e2e:
    name: Playwright E2E Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sso_user
          POSTGRES_PASSWORD: sso_test_password
          POSTGRES_DB: alxprgs_sso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sso_user -d alxprgs_sso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend and SDK wheel
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation -e "./backend[dev]"
          python -m build --no-isolation packages/python-sdk --outdir dist/sdk
          python -m pip install --no-deps dist/sdk/*.whl
          python -m pip check
          python -c "import alxprgs_sso, pathlib; assert 'site-packages' in str(pathlib.Path(alxprgs_sso.__file__).resolve())"

      - name: Run Database Migrations
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          SESSION_SECRET_KEY: "default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only"
        run: |
          cd backend && alembic upgrade head

      - name: Mark fresh dedicated E2E database
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
        run: python -m scripts.init_fresh_ci_test_marker

      - name: Install frontend dependencies and Playwright Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Start Frontend Preview Server
        run: |
          python scripts/manage_test_server.py start-frontend --port 5173 --pidfile /tmp/frontend.pid --logfile /tmp/frontend.log --backend-url http://localhost:8000

      - name: Seed Synthetic E2E Test Accounts (Default-off Profile)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
        run: |
          python scripts/prepare_e2e_data.py

      - name: Start Backend Server (Default-off Profile)
        env:
          DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          SESSION_SECRET_KEY: "default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only"
          FEATURE_TOTP_ENABLED: "false"
          FEATURE_PASSKEY_ENABLED: "false"
          FEATURE_RECOVERY_CODES_ENABLED: "false"
          FEATURE_EMAIL_VERIFICATION_ENABLED: "false"
          REQUIRE_VERIFIED_EMAIL: "false"
          TOTP_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
          JWT_PRIVATE_KEY_PEM: ""
          OIDC_ISSUER: "https://auth.alxprgs.tech"
          WEBAUTHN_RP_ID: "localhost"
          WEBAUTHN_ORIGIN: "http://localhost:5173"
          PORT: "8000"
        run: |
          python scripts/manage_test_server.py start --port 8000 --pidfile /tmp/backend.pid --logfile /tmp/backend_default_off.log --profile default-off
          python scripts/manage_test_server.py preflight --profile default-off --backend-url http://127.0.0.1:8000 --frontend-url http://localhost:5173

      - name: Run Default-off Playwright E2E Tests (sso.spec.ts & multi_client_sso.spec.ts)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:5173"
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          PYTHON_BIN: python
          E2E_CLIENT1_SECRET: analytics_client_secret_123
          E2E_CLIENT2_SECRET: docs_client_secret_123
          E2E_USERNAME: compose_admin
          E2E_PASSWORD: ComposeAdminPass2026!
        run: |
          npx playwright test e2e/sso.spec.ts e2e/multi_client_sso.spec.ts

      - name: Stop Default-off Backend Server
        run: |
          python scripts/manage_test_server.py stop --pidfile /tmp/backend.pid --port 8000

      - name: Seed Synthetic E2E Test Accounts (Enabled Profile)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
        run: |
          python scripts/prepare_e2e_data.py

      - name: Start Backend Server (Enabled Profile)
        env:
          DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          SESSION_SECRET_KEY: "default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only"
          FEATURE_TOTP_ENABLED: "true"
          FEATURE_PASSKEY_ENABLED: "true"
          FEATURE_RECOVERY_CODES_ENABLED: "true"
          FEATURE_EMAIL_VERIFICATION_ENABLED: "true"
          REQUIRE_VERIFIED_EMAIL: "false"
          TOTP_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
          JWT_PRIVATE_KEY_PEM: ""
          OIDC_ISSUER: "https://auth.alxprgs.tech"
          WEBAUTHN_RP_ID: "localhost"
          WEBAUTHN_ORIGIN: "http://localhost:5173"
          PORT: "8000"
        run: |
          python scripts/manage_test_server.py start --port 8000 --pidfile /tmp/backend.pid --logfile /tmp/backend_enabled.log --profile enabled
          python scripts/manage_test_server.py preflight --profile enabled --backend-url http://127.0.0.1:8000 --frontend-url http://localhost:5173

      - name: Run Enabled Playwright E2E Tests (passkey.spec.ts)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:5173"
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
        run: |
          npx playwright test e2e/passkey.spec.ts

      - name: Stop Enabled Backend Server
        if: always()
        run: |
          python scripts/manage_test_server.py stop --pidfile /tmp/backend.pid --port 8000

      - name: Stop Frontend Server
        if: always()
        run: |
          python scripts/manage_test_server.py stop --pidfile /tmp/frontend.pid --port 5173

      - name: Upload Playwright and Server Logs on Failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-and-server-logs
          path: |
            /tmp/frontend.log
            /tmp/backend_default_off.log
            /tmp/backend_enabled.log
            /tmp/backend.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
