name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      run_email_tests:
        required: false
        type: boolean
        default: false
    secrets:
      TESTMAIL_API_KEY:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false

concurrency:
  group: ci-${{ inputs.target_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SENTRY_ENABLED: 'false'
  SENTRY_FRONTEND_ENABLED: 'false'
  SENTRY_REPLAY_ENABLED: 'false'

jobs:
  email-e2e:
    name: Real SES email integration and browser E2E
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || inputs.run_email_tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sso_user
          POSTGRES_PASSWORD: sso_test_password
          POSTGRES_DB: alxprgs_sso_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sso_user -d alxprgs_sso_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PYTHONPATH: .:backend
      TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
      DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
      DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
      SESSION_SECRET_KEY: default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only
      EMAIL_PROVIDER: ses
      ENVIRONMENT: testing
      REQUIRE_VERIFIED_EMAIL: 'true'
      FEATURE_EMAIL_VERIFICATION_ENABLED: 'true'
      FEATURE_TOTP_ENABLED: 'false'
      FEATURE_PASSKEY_ENABLED: 'false'
      FEATURE_RECOVERY_CODES_ENABLED: 'false'
      BASE_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      TESTMAIL_NAMESPACE: ${{ vars.TESTMAIL_NAMESPACE }}
      TESTMAIL_TIMEOUT_SECONDS: ${{ vars.TESTMAIL_TIMEOUT_SECONDS || '120' }}
      TESTMAIL_POLL_INTERVAL_SECONDS: ${{ vars.TESTMAIL_POLL_INTERVAL_SECONDS || '2' }}
      SES_REGION: ${{ vars.SES_REGION || 'us-east-1' }}
      SES_FROM_EMAIL: ${{ vars.SES_FROM_EMAIL || 'sso@alxprgs.tech' }}
      SES_FROM_NAME: ${{ vars.SES_FROM_NAME || 'ALXPRGS' }}
    steps:
      - name: Checkout exact revision without external credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify revision belongs to trusted main history
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies and build without credentials
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation -e './backend[dev]'
          python -m pip check
          cd frontend
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Check credentials, authenticated API contract and SES production access
        env:
          TESTMAIL_API_KEY: ${{ secrets.TESTMAIL_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo 'Required CI AWS credentials are missing'
            exit 1
          fi
          python -m tests.helpers.testmail_cli preflight
      - name: Migrate and mark fresh dedicated database
        run: |
          (cd backend && alembic upgrade head)
          python -m scripts.init_fresh_ci_test_marker
      - name: Real email API scenarios
        env:
          TESTMAIL_API_KEY: ${{ secrets.TESTMAIL_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: pytest tests/integration/test_testmail_email_pg.py -m email_external --run-email-tests -x --tb=short
      - name: Real email browser scenarios with finally cleanup
        env:
          TESTMAIL_API_KEY: ${{ secrets.TESTMAIL_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: python scripts/run_e2e_suite.py --suite email
      - name: Upload allowlisted summaries only
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: email-safe-summary-${{ github.run_attempt }}
          path: |
            artifacts/email/pytest-summary.json
            artifacts/email/browser-summary.json
            artifacts/email/runner-summary.json
          retention-days: 3
          if-no-files-found: ignore

  telemetry-container-check:
    name: Sentry Container Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          persist-credentials: false
      - name: Build immutable containers without telemetry credentials
        run: |
          revision=$(git rev-parse HEAD)
          docker build --build-arg ALX_BUILD_SHA="$revision" -f backend/Dockerfile -t sso-backend-check .
          docker build --build-arg ALX_BUILD_SHA="$revision" -f frontend/Dockerfile -t sso-frontend-check .
          docker run --rm --entrypoint python sso-backend-check -c 'from app.build_info import get_build_info; from app.main import app; assert get_build_info()["version"] == app.version; assert len(get_build_info()["commit_sha"]) == 40'
          docker run --rm --add-host backend:127.0.0.1 sso-frontend-check nginx -t
          docker run --rm sso-frontend-check sh -c 'test -f /usr/share/nginx/html/build-info.json && ! find /usr/share/nginx/html -name "*.map" | grep .'

  verify-cd-template:
    name: Verify Inactive CD Template
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Check CD template is commented out and outside workflows
        run: |
          if [ -f ".github/workflows/cd.yml" ]; then
            echo "ERROR: Active CD workflow .github/workflows/cd.yml must NOT exist!"
            exit 1
          fi
          if [ ! -f "deploy/github-actions/cd.yml.example" ]; then
            echo "ERROR: deploy/github-actions/cd.yml.example not found!"
            exit 1
          fi
          # Проверяем, что каждая непустая строка начинается с '#'
          non_commented=$(grep -v '^#' deploy/github-actions/cd.yml.example | grep -v '^[[:space:]]*$' || true)
          if [ -n "$non_commented" ]; then
            echo "ERROR: deploy/github-actions/cd.yml.example contains uncommented lines:"
            echo "$non_commented"
            exit 1
          fi
          echo "CD template is properly commented and isolated."

  security-and-deps-scan:
    name: Security & Dependencies Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Security and Dependency Scanner
        run: python scripts/scan_secrets_and_deps.py

      - name: Audit pinned Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --strict -r requirements-lock.txt

      - name: Scan tracked source for secrets without printing values
        run: |
          python -m pip install detect-secrets==1.5.0
          python scripts/check_secret_scan.py --self-test

  version-consistency:
    name: Verify Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check version consistency
        run: python scripts/bump_version.py check

  backend-lint-and-test:
    name: Backend Tests & PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sso_user
          POSTGRES_PASSWORD: sso_test_password
          POSTGRES_DB: alxprgs_sso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sso_user -d alxprgs_sso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend and SDK dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation -e "./backend[dev]" -e "./packages/python-sdk"
          python -m pip check

      - name: Run Ruff Lint and Format check
        run: |
          ruff check backend/ tests/ packages/python-sdk/ scripts/ examples/
          ruff format --check backend/ tests/ packages/python-sdk/ scripts/ examples/

      - name: Run Mypy Typecheck
        run: |
          mypy --explicit-package-bases packages/python-sdk/alxprgs_sso backend/app --ignore-missing-imports

      - name: Run Database Migrations
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          SESSION_SECRET_KEY: "default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only"
        run: |
          cd backend && alembic upgrade head

      - name: Mark fresh dedicated CI database and check PostgreSQL client
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version
          psql --version
          python -m scripts.init_fresh_ci_test_marker

      - name: Run Backend Tests on PostgreSQL (Default-off profile)
        env:
          EMAIL_PROVIDER: "smtp"
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          SESSION_SECRET_KEY: "default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only"
          FEATURE_TOTP_ENABLED: "false"
          FEATURE_PASSKEY_ENABLED: "false"
          FEATURE_RECOVERY_CODES_ENABLED: "false"
          REQUIRE_VERIFIED_EMAIL: "false"
          TOTP_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
          JWT_PRIVATE_KEY_PEM: ""
        run: |
          pytest -v tests/

      - name: Run MFA & Feature Flags Tests (Enabled profile)
        env:
          EMAIL_PROVIDER: "smtp"
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          SESSION_SECRET_KEY: "default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only"
          FEATURE_TOTP_ENABLED: "true"
          FEATURE_PASSKEY_ENABLED: "true"
          FEATURE_RECOVERY_CODES_ENABLED: "true"
          REQUIRE_VERIFIED_EMAIL: "true"
          TOTP_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
        run: |
          pytest -v tests/test_mfa_features.py tests/integration/test_email_verification_pg.py tests/integration/test_passkey_pg.py tests/integration/test_distributed_rate_limiting_pg.py

  sdk-build-and-test:
    name: SDK Package Build & Clean Install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build SDK Wheel and Sdist
        run: |
          python -m pip install -r requirements-lock.txt
          python -m build --no-isolation packages/python-sdk --outdir dist/sdk

      - name: Test clean installation in isolated venv
        run: |
          python -m venv test_env
          ./test_env/bin/pip install -r requirements-lock.txt
          ./test_env/bin/pip install --no-deps dist/sdk/*.whl
          ./test_env/bin/pip check
          ./test_env/bin/pytest packages/python-sdk/tests/test_sdk_isolated.py tests/test_python_sdk.py -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Typecheck, Unit Tests and Build
        working-directory: frontend
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run typecheck:tests
          npm test
          npm run test:components
          npm run build

      - name: Build and verify private source maps offline
        run: |
          ALX_RELEASE_BUILD=1 npm --prefix frontend run build
          python scripts/check_sentry_build.py
          docker build -f frontend/Dockerfile.release -t sso-release-frontend-check frontend
          docker run --rm --add-host backend:127.0.0.1 sso-release-frontend-check nginx -t

      - name: Real SDK browser privacy harness (no SSO mocks, no ingestion)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:telemetry:browser

  playwright-e2e:
    name: Playwright E2E Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sso_user
          POSTGRES_PASSWORD: sso_test_password
          POSTGRES_DB: alxprgs_sso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sso_user -d alxprgs_sso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.target_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend and SDK wheel
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps --no-build-isolation -e "./backend[dev]"
          python -m build --no-isolation packages/python-sdk --outdir dist/sdk
          python -m pip install --no-deps dist/sdk/*.whl
          python -m pip check
          python -c "import alxprgs_sso, pathlib; assert 'site-packages' in str(pathlib.Path(alxprgs_sso.__file__).resolve())"

      - name: Run Database Migrations
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          SESSION_SECRET_KEY: "default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only"
        run: |
          cd backend && alembic upgrade head

      - name: Mark fresh dedicated E2E database
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
        run: python -m scripts.init_fresh_ci_test_marker

      - name: Install frontend dependencies and Playwright Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Start Frontend Preview Server
        run: |
          python scripts/manage_test_server.py start-frontend --port 5173 --pidfile /tmp/frontend.pid --logfile /tmp/frontend.log --backend-url http://localhost:8000

      - name: Seed Synthetic E2E Test Accounts (Default-off Profile)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
        run: |
          python scripts/prepare_e2e_data.py

      - name: Start local SMTP capture for registration
        run: |
          python scripts/test_smtp_capture.py --output /tmp/sso-e2e-mailbox.jsonl --port 1025 > /tmp/sso-e2e-smtp.log 2>&1 &
          echo $! > /tmp/sso-e2e-smtp.pid
          python - <<'PY'
          import socket
          import time
          for attempt in range(25):
              try:
                  with socket.create_connection(("127.0.0.1", 1025), timeout=1):
                      break
              except OSError:
                  time.sleep(0.2)
          else:
              raise SystemExit("local SMTP capture did not start")
          PY

      - name: Start Backend Server (Default-off Profile)
        env:
          DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          SESSION_SECRET_KEY: "default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only"
          FEATURE_TOTP_ENABLED: "false"
          FEATURE_PASSKEY_ENABLED: "false"
          FEATURE_RECOVERY_CODES_ENABLED: "false"
          REQUIRE_VERIFIED_EMAIL: "false"
          TOTP_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
          JWT_PRIVATE_KEY_PEM: ""
          OIDC_ISSUER: "https://auth.alxprgs.tech"
          WEBAUTHN_RP_ID: "localhost"
          WEBAUTHN_ORIGIN: "http://localhost:5173"
          SMTP_HOST: "127.0.0.1"
          SMTP_PORT: "1025"
          PORT: "8000"
        run: |
          python scripts/manage_test_server.py start --port 8000 --pidfile /tmp/backend.pid --logfile /tmp/backend_default_off.log --profile default-off
          python scripts/manage_test_server.py preflight --profile default-off --backend-url http://127.0.0.1:8000 --frontend-url http://localhost:5173

      - name: Run Default-off Playwright E2E and UI Regressions
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:5173"
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          PYTHON_BIN: python
          PRIVACY_ENABLED_PROFILE: "0"
          E2E_CLIENT1_SECRET: analytics_client_secret_123
          E2E_CLIENT2_SECRET: docs_client_secret_123
          E2E_USERNAME: compose_admin
          E2E_PASSWORD: ComposeAdminPass2026!
          E2E_MAILBOX_PATH: /tmp/sso-e2e-mailbox.jsonl
        run: |
          npx playwright test e2e/sso.spec.ts e2e/multi_client_sso.spec.ts e2e/telemetry.spec.ts e2e/privacy.spec.ts e2e/appearance.spec.ts

      - name: Stop Default-off Backend Server
        run: |
          python scripts/manage_test_server.py stop --pidfile /tmp/backend.pid --port 8000

      - name: Seed Synthetic E2E Test Accounts (Enabled Profile)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
        run: |
          python scripts/prepare_e2e_data.py

      - name: Start Backend Server (Enabled Profile)
        env:
          DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          DATABASE_URL_SYNC: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          SESSION_SECRET_KEY: "default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only"
          FEATURE_TOTP_ENABLED: "true"
          FEATURE_PASSKEY_ENABLED: "true"
          FEATURE_RECOVERY_CODES_ENABLED: "true"
          REQUIRE_VERIFIED_EMAIL: "false"
          TOTP_ENCRYPTION_KEY: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
          JWT_PRIVATE_KEY_PEM: ""
          OIDC_ISSUER: "https://auth.alxprgs.tech"
          WEBAUTHN_RP_ID: "localhost"
          WEBAUTHN_ORIGIN: "http://localhost:5173"
          PORT: "8000"
        run: |
          python scripts/manage_test_server.py start --port 8000 --pidfile /tmp/backend.pid --logfile /tmp/backend_enabled.log --profile enabled
          python scripts/manage_test_server.py preflight --profile enabled --backend-url http://127.0.0.1:8000 --frontend-url http://localhost:5173

      - name: Run Enabled Playwright E2E and Privacy Tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:5173"
          TEST_DATABASE_URL: postgresql+psycopg://sso_user:sso_test_password@localhost:5432/alxprgs_sso_test
          PYTHON_BIN: python
          PRIVACY_ENABLED_PROFILE: "1"
        run: |
          npx playwright test e2e/passkey.spec.ts e2e/telemetry.spec.ts e2e/privacy.spec.ts

      - name: Stop Enabled Backend Server
        if: always()
        run: |
          python scripts/manage_test_server.py stop --pidfile /tmp/backend.pid --port 8000

      - name: Stop Frontend Server
        if: always()
        run: |
          python scripts/manage_test_server.py stop --pidfile /tmp/frontend.pid --port 5173

      - name: Stop local SMTP capture
        if: always()
        run: |
          if [ -f /tmp/sso-e2e-smtp.pid ]; then kill "$(cat /tmp/sso-e2e-smtp.pid)" || true; fi
          rm -f /tmp/sso-e2e-mailbox.jsonl

      - name: Upload Playwright and Server Logs on Failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-and-server-logs
          path: |
            /tmp/frontend.log
            /tmp/backend_default_off.log
            /tmp/backend_enabled.log
            /tmp/backend.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
