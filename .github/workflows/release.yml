name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Git Tag (e.g. v0.1.0 or v1.0.0-rc.1)"
        required: true
        type: string
      dry_run:
        description: "Dry-run mode (build and verify artifacts without creating GitHub release)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag-and-sha:
    name: Verify Tag and Commit SHA
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - name: Require trusted main workflow ref before release checks
        env:
          RELEASE_WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_WORKFLOW_REF" != 'refs/heads/main' ]; then
            echo 'Release workflow must be dispatched from main; mandatory email checks cannot be skipped'
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Resolve Tag and Validate
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "Resolving tag: $TAG"
          
          # Проверяем формат тега
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "ERROR: Tag $TAG does not match required format vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi

          # Разрешаем SHA коммита тега
          COMMIT_SHA=$(git rev-list -n 1 "$TAG" 2>/dev/null || echo "")
          if [ -z "$COMMIT_SHA" ]; then
            echo "ERROR: Tag $TAG not found in Git repository!"
            exit 1
          fi

          # Извлекаем версию без 'v' строго из коммита тега (FINAL-07)
          VERSION="${TAG#v}"
          ROOT_VERSION=$(git show "$COMMIT_SHA:VERSION" 2>/dev/null | tr -d '[:space:]' || echo "")
          if [ -z "$ROOT_VERSION" ]; then
            echo "ERROR: VERSION file not found in commit $COMMIT_SHA for tag $TAG!"
            exit 1
          fi
          if [ "$VERSION" != "$ROOT_VERSION" ]; then
            echo "ERROR: Tag version '$VERSION' does not match root VERSION '$ROOT_VERSION' in commit $COMMIT_SHA!"
            exit 1
          fi
          # Check all three component versions from the tagged commit.
          PEP_VERSION="$VERSION"
          if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            PEP_VERSION="${BASH_REMATCH[1]}rc${BASH_REMATCH[2]}"
          fi
          git show "$COMMIT_SHA:backend/pyproject.toml" | grep -Fq "version = \"$PEP_VERSION\"" || exit 1
          git show "$COMMIT_SHA:packages/python-sdk/pyproject.toml" | grep -Fq "version = \"$PEP_VERSION\"" || exit 1
          git show "$COMMIT_SHA:frontend/package.json" | grep -Fq "\"version\": \"$VERSION\"" || exit 1

          # Проверяем, что коммит находится в ветке main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "ERROR: Commit $COMMIT_SHA for tag $TAG is not on main branch!"
            exit 1
          fi

          # Проверяем, не существует ли уже опубликованный (не draft) релиз для этого тега
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *"-rc."* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Successfully validated tag $TAG ($COMMIT_SHA) for version $VERSION."

  verify-quality:
    name: Full CI on release commit
    needs: verify-tag-and-sha
    uses: ./.github/workflows/ci.yml
    with:
      target_sha: ${{ needs.verify-tag-and-sha.outputs.commit_sha }}
      run_email_tests: true
    secrets:
      TESTMAIL_API_KEY: ${{ secrets.TESTMAIL_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    permissions:
      contents: read

  build-artifacts:
    name: Build and Verify All Release Artifacts
    needs: [verify-tag-and-sha, verify-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository at exact commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify-tag-and-sha.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build and verify exact release bundle
        env:
          RELEASE_TAG: ${{ needs.verify-tag-and-sha.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify-tag-and-sha.outputs.commit_sha }}
        run: |
          python -m pip install -r requirements-lock.txt
          python scripts/build_release_artifacts.py build --outdir dist/artifacts --tag "$RELEASE_TAG" --require-clean
          python scripts/build_release_artifacts.py verify --outdir dist/artifacts --expected-sha "$RELEASE_SHA"

      - name: Upload Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-artifacts
          path: dist/artifacts/

      - name: Upload private maps separately (never GitHub release assets)
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: sentry-private-maps
          path: dist/sentry-private/
          retention-days: 1
          if-no-files-found: error

  prepare-sentry-release:
    name: Validate and prepare Sentry release
    timeout-minutes: 10
    needs: [verify-tag-and-sha, build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow revision (not tagged code with credentials)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Download immutable release artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: release-artifacts
          path: release-files
      - name: Download private maps
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806
        with:
          name: sentry-private-maps
          path: sentry-private
      - name: Validate offline before accessing any credential
        env:
          RELEASE_SHA: ${{ needs.verify-tag-and-sha.outputs.commit_sha }}
        run: python scripts/sentry_release.py --release-dir release-files --private-maps sentry-private --expected-sha "$RELEASE_SHA"
      - name: Install pinned CLI without credentials or lifecycle scripts
        if: inputs.dry_run != true && vars.SENTRY_RELEASE_UPLOAD_ENABLED == 'true'
        run: npm install --prefix "$RUNNER_TEMP/sentry-tools" --ignore-scripts --save-exact @sentry/cli@3.8.0
      - name: Upload validated maps and finalize release
        if: inputs.dry_run != true && vars.SENTRY_RELEASE_UPLOAD_ENABLED == 'true'
        env:
          RELEASE_SHA: ${{ needs.verify-tag-and-sha.outputs.commit_sha }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_BACKEND: ${{ vars.SENTRY_PROJECT_BACKEND }}
          SENTRY_PROJECT_FRONTEND: ${{ vars.SENTRY_PROJECT_FRONTEND }}
          SENTRY_URL: ${{ vars.SENTRY_URL || 'https://de.sentry.io/' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python scripts/sentry_release.py --release-dir release-files --private-maps sentry-private --expected-sha "$RELEASE_SHA" --repository "$RELEASE_REPOSITORY" --cli "$RUNNER_TEMP/sentry-tools/node_modules/.bin/sentry-cli" --upload

  publish-release:
    name: Publish GitHub Release (Draft Mode)
    needs: [verify-tag-and-sha, build-artifacts, prepare-sentry-release]
    runs-on: ubuntu-latest
    if: github.event.inputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-artifacts
          path: release-files

      - name: Verify Artifact Integrity Against Checksums
        env:
          RELEASE_SHA: ${{ needs.verify-tag-and-sha.outputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$(jq -r .commit_sha release-files/release-manifest.json)" = "$RELEASE_SHA"
          test "$(jq -r .source_tree_dirty release-files/release-manifest.json)" = false
          cd release-files
          sha256sum -c SHA256SUMS.txt
          expected=$(jq -r '.artifacts | keys[]' release-manifest.json | sort)
          actual=$(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt ! -name release-manifest.json -printf '%f\n' | sort)
          test "$expected" = "$actual"
          test "$(sha256sum release-manifest.json | awk '{print $1}')" = "$(awk '$2 == "release-manifest.json" {print $1}' SHA256SUMS.txt)"

      - name: Create or Update Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify-tag-and-sha.outputs.tag }}
          IS_PRE: ${{ needs.verify-tag-and-sha.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          SUMS_SHA=$(sha256sum release-files/SHA256SUMS.txt | cut -d ' ' -f 1)
          MARKER="ALXPRGS-GOAL09:$TAG:${{ needs.verify-tag-and-sha.outputs.commit_sha }}:$SUMS_SHA"
          cp release-files/RELEASE_NOTES.md release-body.md
          printf '\n<!-- %s -->\n' "$MARKER" >> release-body.md
          if gh release view "$TAG" --json isDraft,body,assets > release-state.json 2>/dev/null; then
            IS_DRAFT=$(jq -r .isDraft release-state.json)
            if [ "$IS_DRAFT" != "true" ] || ! jq -e --arg marker "$MARKER" '.body | contains($marker)' release-state.json >/dev/null; then
              echo "Existing release is published or belongs to another artifact set; refusing overwrite"
              exit 1
            fi
            mkdir -p existing-release
            if [ "$(jq '.assets | length' release-state.json)" -gt 0 ]; then
              gh release download "$TAG" --dir existing-release
            fi
            expected=$(find release-files -maxdepth 1 -type f -printf '%f\n' | sort)
            present=$(find existing-release -maxdepth 1 -type f -printf '%f\n' | sort)
            foreign=$(comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$present"))
            if [ -n "$foreign" ]; then echo "Draft contains an unexpected asset"; exit 1; fi
            for asset in existing-release/*; do
              [ -f "$asset" ] || continue
              name=${asset##*/}
              if ! cmp -s "$asset" "release-files/$name"; then
                echo "Draft asset content differs from verified build: $name"
                exit 1
              fi
            done
            comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$present") > missing-assets.txt
            missing=()
            while IFS= read -r name; do missing+=("release-files/$name"); done < missing-assets.txt
            if [ "${#missing[@]}" -gt 0 ]; then gh release upload "$TAG" "${missing[@]}"; fi
          else
            prerelease_args=()
            if [ "$IS_PRE" = "true" ]; then prerelease_args+=(--prerelease); fi
            gh release create "$TAG" release-files/* \
              --title "ALXPRGS SSO $TAG" --notes-file release-body.md --draft "${prerelease_args[@]}"
          fi
          mkdir -p downloaded-release
          gh release download "$TAG" --dir downloaded-release
          (cd downloaded-release && sha256sum -c SHA256SUMS.txt)
          expected=$(find release-files -maxdepth 1 -type f -printf '%f\n' | sort)
          actual=$(find downloaded-release -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "$expected" != "$actual" ]; then
            echo "Uploaded asset set differs from verified build"
            exit 1
          fi
          echo "Draft release verified; publication requires separate owner instruction."
