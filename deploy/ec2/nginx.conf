log_format sso_ec2_safe '$request_method $status $request_time';
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /var/log/nginx/sso-error.log crit;
    location / { return 444; }
}
server {
    listen 80;
    server_name auth.alxprgs.tech;
    access_log /var/log/nginx/sso-access.log sso_ec2_safe;
    error_log /var/log/nginx/sso-error.log crit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://auth.alxprgs.tech$request_uri; }
}
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
    access_log off;
}
server {
    listen 443 ssl;
    server_name auth.alxprgs.tech;
    ssl_certificate /etc/letsencrypt/live/auth.alxprgs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.alxprgs.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/sso-access.log sso_ec2_safe;
    error_log /var/log/nginx/sso-error.log crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    include /opt/alxprgs-sso/current/csp.conf;
    root /opt/alxprgs-sso/current/public;
    charset utf-8;
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    error_page 503 /maintenance.html;
    location = /maintenance.html {
        internal;
        root /var/www/alxprgs-sso;
    }
    location ~* \.map$ { return 404; }
    location ~ ^/(api|oauth|\.well-known|health)/ {
        if (-f /var/lib/alxprgs-sso/maintenance) { return 503; }
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host auth.alxprgs.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-ALX-Geo-City "";
        proxy_set_header X-ALX-Geo-Country "";
    }
    location / {
        if (-f /var/lib/alxprgs-sso/maintenance) { return 503; }
        try_files $uri $uri/ /index.html;
    }
}
