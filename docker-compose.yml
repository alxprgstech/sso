services:
  db:
    image: postgres:16-alpine
    container_name: alxprgs-sso-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sso_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sso_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-sso_db}
    volumes:
      - sso_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sso_user} -d ${POSTGRES_DB:-sso_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sso_network
    # Порт БД не публикуется на хосте для защиты данных (SETUP-08)

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alxprgs-sso-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sso_user}:${POSTGRES_PASSWORD:-sso_secure_password}@db:5432/${POSTGRES_DB:-sso_db}
      DATABASE_URL_SYNC: postgresql+psycopg://${POSTGRES_USER:-sso_user}:${POSTGRES_PASSWORD:-sso_secure_password}@db:5432/${POSTGRES_DB:-sso_db}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:-default-dev-session-secret-key-at-least-64-characters-long-safe-for-dev-only}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
      JWT_KEY_ID: ${JWT_KEY_ID:-default-rsa-key-1}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://auth.alxprgs.tech}
      FEATURE_TOTP_ENABLED: "${FEATURE_TOTP_ENABLED:-false}"
      FEATURE_PASSKEY_ENABLED: "${FEATURE_PASSKEY_ENABLED:-false}"
      FEATURE_RECOVERY_CODES_ENABLED: "${FEATURE_RECOVERY_CODES_ENABLED:-false}"
      FEATURE_EMAIL_VERIFICATION_ENABLED: "${FEATURE_EMAIL_VERIFICATION_ENABLED:-false}"
      REQUIRE_VERIFIED_EMAIL: "${REQUIRE_VERIFIED_EMAIL:-false}"
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-smtp}"
      SES_REGION: "${SES_REGION:-us-east-1}"
      SES_FROM_EMAIL: "${SES_FROM_EMAIL:-sso@alxprgs.tech}"
      SES_FROM_NAME: "${SES_FROM_NAME:-ALXPRGS}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      SMTP_HOST: "${SMTP_HOST:-localhost}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-no-reply@alxprgs.tech}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-false}"
      WEBAUTHN_RP_ID: "${WEBAUTHN_RP_ID:-auth.alxprgs.tech}"
      WEBAUTHN_RP_NAME: "${WEBAUTHN_RP_NAME:-ALXPRGS SSO}"
      WEBAUTHN_ORIGIN: "${WEBAUTHN_ORIGIN:-https://auth.alxprgs.tech}"
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 5s
      timeout: 5s
      retries: 6
    networks:
      - sso_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alxprgs-sso-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Публикация строго на loopback (SETUP-08)
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sso_network

volumes:
  sso_db_data:

networks:
  sso_network:
    driver: bridge
