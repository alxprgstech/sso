# No query, client IP, Referer or user agent in access logs.
log_format sso_safe '$request_method $status $request_time';
server {
    listen 80;
    listen [::]:80;
    server_name localhost auth.alxprgs.tech;

    # Security headers
    include /etc/nginx/snippets/sso-security-headers.conf;
    access_log /var/log/nginx/access.log sso_safe;
    error_log /var/log/nginx/error.log crit;
    location ~* \.map$ { return 404; }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # API and Auth endpoints
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-ALX-Geo-City "";
        proxy_set_header X-ALX-Geo-Country "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OIDC Endpoints
    location /oauth/ {
        proxy_pass http://backend:8000/oauth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Discovery & JWKS
    location /.well-known/ {
        proxy_pass http://backend:8000/.well-known/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthchecks
    location /health/ {
        proxy_pass http://backend:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Single Page Application
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
