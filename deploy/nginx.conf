# ALXPRGS SSO Production Reverse Proxy Configuration
log_format sso_edge_safe '$request_method $status $request_time';
server {
    listen 8080;
    server_name auth.alxprgs.tech;
    access_log /var/log/nginx/access.log sso_edge_safe;
    error_log /var/log/nginx/error.log crit;

    # In production, redirect HTTP to HTTPS
    location / {
        return 301 https://auth.alxprgs.tech$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    access_log /var/log/nginx/access.log sso_edge_safe;
    error_log /var/log/nginx/error.log crit;
    location ~* \.map$ { return 404; }
    server_name auth.alxprgs.tech;

    # SSL Certificates (managed via Let's Encrypt / Certbot in production)
    ssl_certificate /etc/letsencrypt/live/auth.alxprgs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.alxprgs.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Install the generated exact-origin snippet before activating this template.
    include /etc/nginx/snippets/sso-csp.conf;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Single TLS boundary, overwrite client-supplied forwarding headers.
    location ~ ^/(api|oauth|\.well-known|health)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host auth.alxprgs.tech;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-ALX-Geo-City "";
        proxy_set_header X-ALX-Geo-Country "";
    }
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|woff2)$" {
        root /usr/share/nginx/html;
        expires 1y;
        try_files $uri =404;
    }
    location ~ ^/(brand|theme)/ {
        root /usr/share/nginx/html;
        charset utf-8;
        expires 1h;
        try_files $uri =404;
    }
    location / {
        root /usr/share/nginx/html;
        charset utf-8;
        expires -1;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
