# ALXPRGS SSO Production Reverse Proxy Configuration
server {
    listen 80;
    server_name auth.alxprgs.tech;

    # In production, redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name auth.alxprgs.tech;

    # SSL Certificates (managed via Let's Encrypt / Certbot in production)
    ssl_certificate /etc/letsencrypt/live/auth.alxprgs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.alxprgs.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy to SSO Frontend / App Gateway
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-ALX-Geo-City "";
        proxy_set_header X-ALX-Geo-Country "";
        proxy_set_header X-Forwarded-Proto https;
    }
}
