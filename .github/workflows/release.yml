name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Git Tag (e.g. v0.1.0 or v1.0.0-rc.1)"
        required: true
        type: string
      dry_run:
        description: "Dry-run mode (build and verify artifacts without creating GitHub release)"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tag-and-sha:
    name: Verify Tag and Commit SHA
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
      version: ${{ steps.resolve.outputs.version }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve Tag and Validate
        id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "Resolving tag: $TAG"
          
          # Проверяем формат тега
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "ERROR: Tag $TAG does not match required format vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi

          # Разрешаем SHA коммита тега
          COMMIT_SHA=$(git rev-list -n 1 "$TAG" 2>/dev/null || echo "")
          if [ -z "$COMMIT_SHA" ]; then
            echo "ERROR: Tag $TAG not found in Git repository!"
            exit 1
          fi

          # Извлекаем версию без 'v' строго из коммита тега (FINAL-07)
          VERSION="${TAG#v}"
          ROOT_VERSION=$(git show "$COMMIT_SHA:VERSION" 2>/dev/null | tr -d '[:space:]' || echo "")
          if [ -z "$ROOT_VERSION" ]; then
            echo "ERROR: VERSION file not found in commit $COMMIT_SHA for tag $TAG!"
            exit 1
          fi
          if [ "$VERSION" != "$ROOT_VERSION" ]; then
            echo "ERROR: Tag version '$VERSION' does not match root VERSION '$ROOT_VERSION' in commit $COMMIT_SHA!"
            exit 1
          fi

          # Проверяем, что коммит находится в ветке main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" origin/main; then
            echo "ERROR: Commit $COMMIT_SHA for tag $TAG is not on main branch!"
            exit 1
          fi

          # Проверяем, не существует ли уже опубликованный (не draft) релиз для этого тега
          EXISTING_RELEASE=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo "NOT_FOUND")
          if [ "$EXISTING_RELEASE" = "false" ]; then
            echo "ERROR: Published release for tag $TAG already exists! Overwriting published releases is forbidden."
            exit 1
          fi

          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *"-rc."* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Successfully validated tag $TAG ($COMMIT_SHA) for version $VERSION."

  build-artifacts:
    name: Build and Verify All Release Artifacts
    needs: verify-tag-and-sha
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository at exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag-and-sha.outputs.commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "20"

      - name: Verify Quality and Consistency on Release Commit
        run: |
          python -m pip install --upgrade pip build
          pip install -e "./backend[dev]" -e "./packages/python-sdk"
          python scripts/bump_version.py check
          python scripts/scan_secrets_and_deps.py
          ruff check backend tests packages/python-sdk scripts
          mypy --explicit-package-bases packages/python-sdk/alxprgs_sso backend/app --ignore-missing-imports

      - name: Build Backend and SDK Wheels & Sdist
        run: |
          mkdir -p dist/artifacts
          python -m build backend --outdir dist/artifacts
          python -m build packages/python-sdk --outdir dist/artifacts

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          tar -czf ../dist/artifacts/alxprgs-sso-frontend-${{ needs.verify-tag-and-sha.outputs.version }}.tar.gz -C dist .

      - name: Extract Release Notes from CHANGELOG
        run: |
          python -c "
          import re, sys
          from pathlib import Path
          content = Path('CHANGELOG.md').read_text(encoding='utf-8')
          version = '${{ needs.verify-tag-and-sha.outputs.version }}'
          pattern = r'## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
          else:
              notes = f'Release {version}'
          Path('dist/artifacts/RELEASE_NOTES.md').write_text(notes, encoding='utf-8')
          "

      - name: Generate Checksums and Manifest
        working-directory: dist/artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat <<EOF > release-manifest.json
          {
            "product": "ALXPRGS SSO",
            "version": "${{ needs.verify-tag-and-sha.outputs.version }}",
            "tag": "${{ github.event.inputs.tag }}",
            "commit_sha": "${{ needs.verify-tag-and-sha.outputs.commit_sha }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "files": $(ls -1 | grep -v 'release-manifest.json' | jq -R -s -c 'split("\n")[:-1]')
          }
          EOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-artifacts
          path: dist/artifacts/

  publish-release:
    name: Publish GitHub Release (Draft Mode)
    needs: [verify-tag-and-sha, build-artifacts]
    runs-on: ubuntu-latest
    if: github.event.inputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout repository at exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify-tag-and-sha.outputs.commit_sha }}

      - name: Download Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: release-artifacts
          path: release-files

      - name: Verify Artifact Integrity Against Checksums
        working-directory: release-files
        run: |
          sha256sum -c SHA256SUMS.txt

      - name: Create or Update Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
          IS_PRE: ${{ needs.verify-tag-and-sha.outputs.is_prerelease }}
        run: |
          echo "Managing draft release for $TAG..."
          EXISTING_DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo "NOT_FOUND")
          if [ "$EXISTING_DRAFT" = "true" ]; then
            echo "Existing draft release found for $TAG. Updating artifacts..."
            gh release upload "$TAG" release-files/* --clobber
          else
            echo "Creating new draft release for $TAG..."
            gh release create "$TAG" release-files/* \
              --title "ALXPRGS SSO $TAG" \
              --notes-file release-files/RELEASE_NOTES.md \
              --draft \
              $([ "$IS_PRE" = "true" ] && echo "--prerelease")
          fi
          echo "Draft release successfully prepared for $TAG. Manual review required before final publishing."
